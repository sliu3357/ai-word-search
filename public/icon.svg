<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#10b981"/>
  <rect x="64" y="64" width="384" height="384" rx="32" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Letter grid representing word search puzzle -->
  <text x="112" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#0f6b47">W</text>
  <text x="216" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#54707a">O</text>
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#54707a">R</text>
  <text x="112" y="290" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#54707a">D</text>
  <text x="216" y="290" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ec7741">L</text>
  <text x="320" y="290" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#54707a">Y</text>
